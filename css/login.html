<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Travel Planner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
    <div class="form" style="width:100%;max-width:400px;">
      <h2 style="text-align:center;margin-bottom:10px;">✈️ Вход</h2>
      <p style="text-align:center;color:var(--muted);margin-bottom:20px;">Панин Андрей Андреевич</p>
      <div>
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div>
        <label>Пароль</label>
        <input type="password" id="password" required>
      </div>
      <button class="btn" onclick="doLogin()">Войти</button>
      <button class="btn btn--ghost" onclick="location.href='register.html'">Регистрация</button>
    </div>
  </div>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
