<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — Travel Planner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
    <div class="form" style="width:100%;max-width:400px;">
      <h2 style="text-align:center;margin-bottom:10px;">✈️ Регистрация</h2>
      <p style="text-align:center;color:var(--muted);margin-bottom:20px;">Панин Андрей Андреевич</p>
      <div><label>Имя</label><input type="text" id="name" required></div>
      <div><label>Email</label><input type="email" id="email" required></div>
      <div><label>Пароль</label><input type="password" id="password" required></div>
      <button class="btn" onclick="doRegister()">Создать аккаунт</button>
      <button class="btn btn--ghost" onclick="location.href='login.html'">У меня есть аккаунт</button>
    </div>
  </div>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
